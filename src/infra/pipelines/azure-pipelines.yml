trigger:
- main

stages:
- stage: DeployDev
  displayName: 'Deploy to Development'
  jobs:
  - job: Provision
    steps:
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          $params = Get-Content 'params/dev.json' | ConvertFrom-Json
          $subId = $params.parameters.subscriptionId.value
          $serviceConn = $params.parameters.serviceConnection.value
          Write-Host "##vso[task.setvariable variable=subId]$subId"
          Write-Host "##vso[task.setvariable variable=serviceConnection]$serviceConn"
    - task: AzureResourceManagerTemplateDeployment@3
      inputs:
        deploymentScope: 'Subscription'
        azureResourceManagerConnection: '$(serviceConnection)'
        subscriptionId: '$(subId)'
        location: 'eastus'
        csmFile: 'main.bicep'
        csmParametersFile: 'params/dev.json'
        deploymentMode: 'Incremental'

- stage: DeployProd
  displayName: 'Deploy to Production'
  dependsOn: DeployDev
  condition: succeeded() # Only runs if Dev succeeds
  jobs:
  - deployment: ProvisionProd
    environment: 'Production' # Links to Azure DevOps Environment with Approval Gates
    strategy:
      runOnce:
        deploy:
          steps:
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                $params = Get-Content 'params/prod.json' | ConvertFrom-Json
                $subId = $params.parameters.subscriptionId.value
                $serviceConn = $params.parameters.serviceConnection.value
                Write-Host "##vso[task.setvariable variable=subId]$subId"
                Write-Host "##vso[task.setvariable variable=serviceConnection]$serviceConn"
          - task: AzureResourceManagerTemplateDeployment@3
            inputs:
              deploymentScope: 'Subscription'
              azureResourceManagerConnection: '$(serviceConnection)'
              subscriptionId: '$(subId)'
              location: 'eastus'
              csmFile: 'main.bicep'
              csmParametersFile: 'params/prod.json'
              deploymentMode: 'Incremental'
